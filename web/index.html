<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Proximity Logger</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main>
        <h1>接近イベント</h1>

        <p>
            Raspberry Pi 接近検知履歴
        </p>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>接近した端末</th>
                    <th>状態</th>
                    <th>平均RSSI</th>
                    <th>検知時刻</th>
                </tr>
            </thead>

            <tbody id="event-list">
                <tr>
                    <td colspan="5">イベントを読み込んでいます...</td>
                </tr>
            </tbody>
        </table>
    </main>

    <script src="app.js"></script>

</body>
</html>
